services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: boardlens
      POSTGRES_USER: boardlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boardlens"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BOARDLENS_DATABASE_URL: postgresql+psycopg://boardlens:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/boardlens
      BOARDLENS_ARTIFACT_ROOT: /app/artifacts
    volumes:
      - ./artifacts:/app/artifacts
      - ./configs:/app/configs:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["8080:80"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres_data:
