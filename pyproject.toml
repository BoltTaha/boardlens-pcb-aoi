[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boardlens"
version = "0.1.0"
description = "Production-oriented PCB automated optical inspection proof of concept"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.43",
  "psycopg[binary]==3.2.10",
  "alembic==1.16.5",
  "python-multipart==0.0.20",
  "pillow==11.3.0",
  "numpy==2.2.6",
  "pyyaml==6.0.2",
  "structlog==25.4.0",
]

[project.optional-dependencies]
ml = [
  "anomalib[cpu]==2.6.2",
  "scikit-learn==1.7.2",
  "scipy==1.16.2",
  "pandas==2.3.3",
  "matplotlib==3.10.6",
]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "httpx==0.28.1",
  "ruff==0.13.3",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/boardlens/api/routes.py" = ["B008"]
